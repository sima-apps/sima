<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SIMA - Login</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F6CBD">

<!-- Android / Chrome install -->
<link rel="icon" href="./icons/icon-192.png">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIMA">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>Memuat SIMA&hellip;</span>
  </div>

  <div class="canvas">
    <div class="card" id="loginCard">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4L2 8.5L12 13L22 8.5L12 4Z" fill="currentColor"/>
          <path d="M6 10.3V15C6 15 8.5 17 12 17C15.5 17 18 15 18 15V10.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 9.5V15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="21" cy="16.5" r="1.1" fill="currentColor"/>
        </svg>
      </div>
      <h1 id="formTitle">Halaman Login SIMA</h1>
      <div class="sub" id="formSub"></div>

      <!-- LOGIN -->
      <form id="formLogin" onsubmit="return doLogin(event)">
        <div class="field">
          <label>Username</label>
          <input id="loginUsername" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pwWrap">
            <input id="loginPassword" type="password" autocomplete="current-password" required>
            <button type="button" class="eyeBtn" id="eyeBtn" onclick="togglePassword()" aria-label="Tampilkan password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="rowBetween">
          <label class="chk">
            <input type="checkbox" id="rememberMe">
            <span class="box"></span>
            <span class="chkLabel">Ingat saya</span>
          </label>
        </div>

        <div class="msg" id="loginMsg"></div>
        <button class="primary" id="loginBtn" type="submit">Masuk</button>

        <div class="switchRow">
          Belum Punya Akun? <a href="javascript:void(0)" onclick="toggleForm('register')">Daftar Disini</a>
        </div>
      </form>

      <!-- REGISTER -->
      <form id="formRegister" class="hidden" onsubmit="return doRegister(event)">
        <div class="field"><label>Nama Lembaga</label><input id="regNama" required></div>
        <div class="field"><label>Username</label><input id="regUsername" autocomplete="username" required></div>
        <div class="field"><label>Password</label><input id="regPassword" type="password" autocomplete="new-password" required></div>
        <div class="msg" id="registerMsg"></div>
        <button class="primary" id="registerBtn" type="submit">Daftar</button>

        <div class="switchRow">
          Sudah Punya Akun? <a href="javascript:void(0)" onclick="toggleForm('login')">Masuk Disini</a>
        </div>
      </form>

      <div class="foot">Hanya untuk akun yang terdaftar</div>
    </div>
  </div>

  <button id="install-btn" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
    Instal Aplikasi
  </button>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
